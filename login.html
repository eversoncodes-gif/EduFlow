<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="descripion" content="pagina de login do sistema da EmbersTech">
    <meta name="keywords" content="login,EuFlow,Base da escolas,">
    <meta name="author" content="Everson Anselmo Muianga">
    <link rel="stylesheet" href="css.da.pasgina/login.css">

    <title>EduFLow - login</title>
</head>
<body>
    <main>
        <section class="login-data">
            <H1>Entrar no EduFlow</H1>
            <div class="container">
                <div class="logo"></div>
                <Form id="login-form">
                    <div class="campo">
                        <label for="nome">Nome de utilizador</label>
                        <!-- <h2>Digite seu Nome</h2> -->
                       <input id="nome" 
                       type="text" 
                       name="nome" 
                       placeholder="Escreva seu nome aqui"
                       required>
                    </div>
                    <div class="campo">
                         <label for="password">Palavra-passe</label>
                          <input
                           type="password" 
                           name="password" 
                           id="password"
                           placeholder="Digite sua senha"
                           required>
                    </div>
                    <button id="abrir" type="submit">Entrar</button>
                    <!-- <input type="submit" value="submeter o sistema"> -->
                </Form>
           </div>
     
        </section>
    </main>
    <footer><p>&COPY;2026 EmbersTech</p></footer>
    <script src="java-script/inicio.js" ></script>
</body>
</html>
